<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>News Story | 54 News HD</title><link rel="icon" href="./assets/icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font-family:Arial,sans-serif;line-height:1.7}header{padding:16px 5%;background:#111d30;border-bottom:3px solid #e32636;font-size:23px;font-weight:900}header a{color:#fff;text-decoration:none}header span{color:#e32636}main{width:min(850px,92%);margin:30px auto;background:#152238;padding:clamp(18px,4vw,36px);border-radius:12px}h1{line-height:1.25}#date{color:#a8b4c7;font-size:13px}#image{width:100%;max-height:480px;object-fit:cover;border-radius:9px;margin:15px 0}#content{white-space:pre-wrap}a.back{color:#ff5966}footer{text-align:center;color:#8291a7;padding:25px}
</style></head><body><header><a href="./index.html"><span>54 NEWS</span> HD</a></header><main><a class="back" href="./index.html">← Back to home</a><h1 id="title">Loading story…</h1><div id="date"></div><img id="image" hidden alt=""><div id="content"></div></main><footer>© 54 News HD</footer>
<script>
(async()=>{const q=new URLSearchParams(location.search),id=q.get("id");try{const r=await fetch("./posts.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const posts=await r.json();const p=posts.find(x=>String(x.id)===String(id)&&x.status!=="draft");if(!p)throw 0;document.title=p.title+" | 54 News HD";document.getElementById("title").textContent=p.title||"";document.getElementById("date").textContent=p.date||"";document.getElementById("content").textContent=p.content||p.summary||"";if(p.image){const im=document.getElementById("image");im.src=p.image;im.hidden=false;}}catch(e){document.getElementById("title").textContent="Story not found";document.getElementById("content").textContent="This story may have been removed or is not published.";}})();
</script></body></html>
